name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt build
      - run: python -m pytest -q
      - run: python scripts/operate.py
      - run: python -m build
      - run: pip install dist/*.whl
      - run: patch-intent-twin examples/compliant_patch.json --budget 0.0 --output /tmp/intent-receipt.json
      - run: python -c 'import json; d=json.load(open("/tmp/intent-receipt.json")); assert d["decision"] == "ALLOW"; assert d["metrics"]["alignment_score"] == 1.0; assert len(d["digest"]) == 64'
